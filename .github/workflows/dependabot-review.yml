name: Request Dependabot PR review

on:
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  request-review:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      # Do not check out or run code from the pull request.
      - name: Request review from amyroi
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers"
          --field 'reviewers[]=amyroi' --silent
