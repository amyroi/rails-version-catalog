- slug: local-ci
  category: Config / Platform Differences
  demo_type: comparison_card
  title: Local CI
  summary: Rails 8.1 の Local CI DSL で、クラウド CI 以外にもローカルで実行できる標準の手順を定義できます。
  notes_by_version:
    '7.0': GitHub Actions や CircleCI など、クラウド CI の設定ファイルを使う構成が中心でした。
    '8.0': 新規アプリに CI ワークフローは含まれますが、ローカル実行向けの DSL はありませんでした。
    8.1.4: config/ci.rb と bin/ci により、開発マシン上で実行する CI の手順を定義できるようになりました。
  highlights_by_version:
    '7.0': クラウド CI が中心
    '8.0': CI ワークフローを生成
    8.1.4: config/ci.rb と bin/ci
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: Rails 7.0 ではクラウド CI、Rails 8.0 では生成したワークフローが中心でした。Rails 8.1 では config/ci.rb と bin/ci によるローカル実行の手順が加わります。
- slug: credentials-fetching
  category: Config / Platform Differences
  demo_type: comparison_card
  title: Command-line Credentials Fetching
  summary: Rails 8.1 では、コマンドラインで credentials を取得し、デプロイに利用しやすくなりました。
  notes_by_version:
    '7.0': credentials は Rails 内で読むことが多く、デプロイとの連携には独自のスクリプトが必要になりがちでした。
    '8.0': Kamal は標準構成に加わりましたが、credentials の取得を前提とするコマンドラインの利用手順はまだ限られていました。
    8.1.4: rails credentials:fetch が紹介され、Kamal のシークレットと暗号化した credentials を接続しやすくなりました。
  highlights_by_version:
    '7.0': シークレット取得を独自実装
    '8.0': Kamal を標準構成に追加
    8.1.4: rails credentials:fetch
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: rails credentials:fetch で、暗号化した credentials をデプロイ用ツールから取得できます。Kamal のシークレットの取得経路を整理するための変更です。
- slug: deprecated-associations
  category: Config / Platform Differences
  demo_type: comparison_card
  title: Deprecated Associations
  summary: Rails 8.1 では、関連を非推奨と宣言して、その利用を検出できます。
  notes_by_version:
    '7.0': 関連の利用を制限したり移行を警告したりするには、静的検査や独自の警告処理を使うことが多くありました。
    '8.0': 非推奨の関連の利用を検出する標準機能は未同梱でした。
    8.1.4: 'has_many :posts, deprecated: true のように、関連そのものを非推奨と宣言できます。'
  highlights_by_version:
    '7.0': 移行警告を独自実装
    '8.0': 非推奨の関連の標準対応は未同梱
    8.1.4: 'deprecated: true'
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: Rails 8.1 では関連自体を非推奨と宣言できます。スキーマの移行や API の整理中に、どの関連がまだ参照されているかをアプリで検出しやすくなります。
- slug: propshaft
  category: Config / Platform Differences
  demo_type: comparison_card
  title: Propshaft
  summary: Sprockets が任意の依存関係となり、Propshaft が標準になるまでのアセットパイプラインの変化を比較します。
  notes_by_version:
    '7.0': Sprockets は任意の依存関係になりましたが、アセットパイプラインでは引き続き主要な比較対象でした。
    '8.0': 新規アプリでは Propshaft が標準となり、アセット管理が簡素になりました。
    8.1.4: Propshaft を標準とする構成を継続し、importmap・Hotwire と組み合わせた軽量な構成を保ちやすくなっています。
  highlights_by_version:
    '7.0': Sprockets が任意の依存関係に
    '8.0': Propshaft が標準に
    8.1.4: Propshaft の標準採用を継続
  status_by_version:
    '7.0': Sprockets が主要な比較対象
    '8.0': アセットパイプラインの標準は Propshaft
    8.1.4: Propshaft の標準採用を継続
  files_by_version:
    '7.0':
    - config/importmap.rb
    - app/views/features/demos/_propshaft.html.erb
    - app/controllers/features_controller.rb
    '8.0':
    - config/importmap.rb
    - app/views/features/demos/_propshaft.html.erb
    - app/controllers/features_controller.rb
    8.1.4:
    - config/importmap.rb
    - app/views/features/demos/_propshaft.html.erb
    - app/controllers/features_controller.rb
  upgrade_notes_by_version:
    '7.0':
    - Propshaft を採用する前に、Sprockets 固有の前提を整理します。
    - アセットのフィンガープリントと importmap の組み合わせを確認します。
    '8.0':
    - 標準のアセットパイプラインが、アプリの起動とデプロイに組み込まれているか確認します。
    - 移行前に、Sprockets 固有のヘルパーや設定を確認します。
    8.1.4:
    - アセットの更新時は、importmap と Propshaft の設定を揃えます。
    - Rails の更新ごとに、フィンガープリント付きアセットの挙動を再確認します。
  code_examples_by_version:
    '7.0':
    - config/importmap.rb
    '8.0':
    - Propshaft enabled
    8.1.4:
    - importmap + Propshaft
  operational_notes_by_version:
    '7.0':
    - ヘルパーやアセットの読み込み経路に、Sprockets 固有の前提がないか確認します。
    '8.0':
    - アセットの事前コンパイルと、フィンガープリント付きファイルの処理を確認します。
    8.1.4:
    - デプロイやキャッシュ無効化の変更後に、アセットの配信を再確認します。
  live_demo_available: true
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: Rails 8 の新規アプリでは Propshaft が標準のアセットパイプラインです。
    detail_2: "• Sprockets 固有の複雑さを削減"
    detail_3: "• フィンガープリントとダイジェストの前提は維持"
    detail_4: "• importmap と Propshaft を組み合わせ"
- slug: kamal
  category: Config / Platform Differences
  demo_type: comparison_card
  title: Kamal によるデプロイ
  summary: Kamal が Rails アプリの標準的なデプロイ構成に加わるまでの変化を比較します。
  notes_by_version:
    '7.0': Capistrano、独自の CI/CD、PaaS などに依存するデプロイが中心でした。
    '8.0': Kamal が Gemfile や設定に加わり、自分で管理するサーバーへのデプロイをアプリに組み込みやすくなりました。
    8.1.4: コンテナレジストリを使わない Kamal のデプロイが追加され、初回デプロイの準備が簡素になりました。
  highlights_by_version:
    '7.0': アプリのチームがデプロイ方式を選択
    '8.0': Kamal を統合
    8.1.4: レジストリなしの Kamal デプロイ
  status_by_version:
    '7.0': 独自のデプロイ経路が中心
    '8.0': Kamal が標準のデプロイ構成に追加
    8.1.4: レジストリなしのデプロイが利用可能
  files_by_version:
    '7.0':
    - config/deploy.yml
    - ".kamal/secrets"
    - app/views/features/demos/_kamal.html.erb
    '8.0':
    - config/deploy.yml
    - ".kamal/secrets"
    - app/views/features/demos/_kamal.html.erb
    8.1.4:
    - config/deploy.yml
    - ".kamal/secrets"
    - app/views/features/demos/_kamal.html.erb
  upgrade_notes_by_version:
    '7.0':
    - 独自のデプロイ経路から、アプリを中心に再現できる手順への移行を検討します。
    - Kamal へ移行する前に、シークレットの扱いを確認します。
    '8.0':
    - config/deploy.yml と .kamal/secrets をデプロイ先に合わせます。
    - コンテナレジストリとプロキシの設定を、新しいデプロイ経路で管理するか決めます。
    8.1.4:
    - 更新前に、レジストリなしのデプロイと本番の標準設定を確認します。
    - 更新の一環として、シークレットとイメージの保存先を見直します。
  code_examples_by_version:
    '7.0':
    - bin/kamal deploy
    '8.0':
    - config/deploy.yml
    8.1.4:
    - rails credentials:fetch
  operational_notes_by_version:
    '7.0':
    - デプロイ用シークレットとサーバー一覧を、分けて文書化します。
    '8.0':
    - イメージの保存先、プロキシ、シークレットの設定をまとめて確認します。
    8.1.4:
    - 本番配備前に、レジストリなしでデプロイするための前提を再確認します。
  adoption_when:
  - コンテナイメージ、サーバー一覧、プロキシ、シークレットを Rails のリポジトリから確認できるデプロイを求める場合。
  - PaaS にすべてを任せず、チームでサーバーへのデプロイを運用できる場合。
  - config/deploy.yml、.kamal/secrets、Docker イメージの設定、実行コマンドからデプロイの挙動を確認したい場合。
  adoption_cautions:
  - 生成した設定ファイルだけで運用できるとは考えないでください。サーバー接続、レジストリの認証、プロキシ、切り戻しにも運用責任が必要です。
  - 既存の Capistrano・PaaS・CI/CD に環境固有の安全確認がある場合は、移行時に注意が必要です。
  - このカタログでは、本番の切り戻しやレジストリなしのデプロイを、一連の操作としては検証していません。
  adoption_alternatives:
  - Kamal のコンテナ構成を採用せず SSH でデプロイしたい場合は、Capistrano も選択肢です。
  - サーバーとプロキシの管理負担を減らしたい場合は、PaaS が適することもあります。
  - 既存の CI/CD がシークレット、承認、切り戻しを網羅している場合は、それを維持する方が安全なこともあります。
  adoption_requirements:
  - 本番利用前に、config/deploy.yml に実際のサーバー・イメージ・プロキシ・環境設定を指定します。
  - 公開しても安全なデプロイ経路にするには、.kamal/secrets で config/master.key などのローカルファイルではなく、環境変数やパスワードマネージャを参照します。
  - 本番で Kamal に依存する前に、レジストリの認証情報、RAILS_MASTER_KEY、切り戻しコマンドをまとめて検証します。
  live_demo_available: true
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: Rails 8.0 で標準構成に加わった Kamal は、Rails 8.1 ではレジストリなしのデプロイにも対応します。デプロイ方式を個別に設計することが多かった Rails 7.0 と比較できます。
