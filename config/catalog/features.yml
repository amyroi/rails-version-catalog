  adoption_alternatives:
  - すでに Redis を運用し、追い出し動作や監視の仕組みに依存している場合は、Redis も適しています。
  - 永続化が不要な小規模の開発確認には、`memory_store` で十分な場合もあります。
  adoption_requirements:
  - "`config/cache.yml` に、利用するキャッシュ用データベースとストアの動作を設定する必要があります。"
  - 本番利用前に、キャッシュテーブルのサイズ・有効期限・削除処理を監視します。
  - Redis やメモリーストアから移行する際は、キーと無効化の処理を再確認します。
  live_demo_available: true
  source_links_by_version:
