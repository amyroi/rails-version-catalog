---
features:
- slug: authentication-generator
  category: Interactive Demo
  demo_type: runtime_demo
  title: Authentication generator
  summary: Rails の標準認証 story がどう変わったかを、サインアップ・ログイン・保護ページで確認できます。
  notes_by_version:
    '7.0': 標準認証 generator は未同梱で、Devise などの外部ライブラリか手作業実装に寄りがちでした。
    '8.0': generate authentication で Users / Sessions / Password reset の土台をすぐに作れるようになりました。
    8.1.2: 認証 generator は Rails 8 系の標準導線として定着し、Current session・rate limit・password
      reset と一緒に学びやすくなっています.
  highlights_by_version:
    '7.0': No first-party auth generator
    '8.0': First-party authentication generator
    8.1.2: Stable Rails 8 auth baseline
  status_by_version:
    '7.0': Hand-rolled or third-party auth
    '8.0': First-party generator baseline
    8.1.2: Stable Rails auth stack
  files_by_version:
    '7.0':
      - app/controllers/concerns/authentication.rb
      - app/controllers/sessions_controller.rb
      - app/controllers/passwords_controller.rb
      - app/views/sessions/new.html.erb
    '8.0':
      - app/models/user.rb
      - app/models/session.rb
      - app/controllers/sessions_controller.rb
      - app/controllers/passwords_controller.rb
    8.1.2:
      - app/models/current.rb
      - app/models/session.rb
      - app/views/auth_labs/show.html.erb
      - app/views/passwords/edit.html.erb
  upgrade_notes_by_version:
    '7.0':
      - Replace ad hoc auth with generated sessions, password reset, and signed cookies.
      - Audit custom sign-in and reset flows before adopting the generator.
    '8.0':
      - Wire the generated controllers into the existing sign-in and password reset screens.
      - Keep unauthenticated access boundaries explicit around protected pages.
    8.1.2:
      - Keep `Current.session` and `rate_limit` behavior in mind when upgrading.
      - Verify redirects to the protected page still match the app's auth flow.
  code_examples_by_version:
    '7.0':
      - bin/rails generate authentication
    '8.0':
      - User.authenticate_by(params.permit(:email_address, :password))
    8.1.2:
      - start_new_session_for user
  operational_notes_by_version:
    '7.0':
      - Check custom auth and reset endpoints for gaps before switching.
    '8.0':
      - Confirm password reset mail delivery and signed session cookies.
    8.1.2:
      - Re-test protected pages, rate limits, and session expiry together.
  live_demo_available: true
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.2: https://guides.rubyonrails.org/8_1_release_notes.html
- slug: solid-queue
  category: Interactive Demo
  demo_type: runtime_demo
  title: Solid Queue
  summary: Active Job backend の変化を、enqueue と状態遷移の UI で確認できます。
  notes_by_version:
    '7.0': デフォルトは in-process / non-durable backend で、永続 queue は別途選定が必要でした。
    '8.0': Solid Queue が production default story に入り、DB-backed queue を採用しやすくなりました。
    8.1.2: Continuations と組み合わせやすい durable backend として、Rails 8.1 系の新機能の土台にもなります。
  highlights_by_version:
    '7.0': Async / external queue choice
    '8.0': Solid Queue arrives
    8.1.2: Continuations-ready durable queue
  status_by_version:
    '7.0': In-process or external queue choice
    '8.0': Production default durable queue
    8.1.2: Durable queue with continuations baseline
  files_by_version:
    '7.0':
      - app/controllers/queue_runs_controller.rb
      - app/jobs/queue_run_job.rb
      - config/queue.yml
    '8.0':
      - config/queue.yml
      - db/queue_schema.rb
      - bin/jobs
    8.1.2:
      - app/views/features/demos/_solid_queue.html.erb
      - app/models/queue_run.rb
      - app/jobs/queue_run_job.rb
  upgrade_notes_by_version:
    '7.0':
      - Move from in-process or external queue choices to a durable queue backend.
      - Add a worker boot command before relying on background processing.
    '8.0':
      - Confirm `config/queue.yml` and `bin/jobs` are wired into local development and deploy.
      - Treat Solid Queue as the default backend story rather than an add-on.
    8.1.2:
      - Review continuations, queue durability, and worker concurrency together.
      - Validate queue visibility and completion reporting after the upgrade.
  code_examples_by_version:
    '7.0':
      - bin/jobs start
    '8.0':
      - config.active_job.queue_adapter = :solid_queue
    8.1.2:
      - QueueRunJob.perform_later(queue_run.id)
  operational_notes_by_version:
    '7.0':
      - Check whether a separate worker process is needed before enabling jobs.
    '8.0':
      - Keep `bin/jobs start` or an equivalent worker command running.
    8.1.2:
      - Verify durable queue processing and turbo-stream updates together.
  live_demo_available: true
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.2: https://guides.rubyonrails.org/8_1_release_notes.html
- slug: solid-cable
  category: Interactive Demo
  demo_type: runtime_demo
  title: Solid Cable
  summary: Turbo Stream と DB-backed cable story の違いを、ライブ更新 UI で確認できます。
  notes_by_version:
    '7.0': Action Cable は Redis 構成が一般的で、DB-backed cable は標準の主流ではありませんでした。
    '8.0': Solid Cable が Rails 8 の default stack に入り、DB-backed realtime の選択肢が近くなりました。
    8.1.2: Solid 系 stack とあわせて、single-app で queue / cache / cable を揃えやすい構成が続いています。
  highlights_by_version:
    '7.0': Redis-first realtime setups
    '8.0': Solid Cable default story
    8.1.2: DB-backed realtime remains first-class
  status_by_version:
    '7.0': Redis-backed realtime or custom cable setup
    '8.0': DB-backed realtime enters the default stack
    8.1.2: Durable realtime stays first-class
  files_by_version:
    '7.0':
      - config/cable.yml
      - app/views/features/demos/_solid_cable.html.erb
      - app/controllers/features_controller.rb
    '8.0':
      - config/cable.yml
      - app/views/features/demos/_solid_cable.html.erb
      - app/controllers/features_controller.rb
    8.1.2:
      - config/cable.yml
      - app/views/features/demos/_solid_cable.html.erb
      - app/controllers/features_controller.rb
  upgrade_notes_by_version:
    '7.0':
      - Move away from Redis-first assumptions if you want the app to stay in the default Rails stack.
      - Review whether realtime streams can be backed by the database in your environment.
    '8.0':
      - Confirm `config/cable.yml` and the cable database are configured together.
      - Re-test broadcast flows after switching to the DB-backed adapter.
    8.1.2:
      - Verify turbo-stream updates, message retention, and database-backed cable polling together.
      - Keep the cable database and runtime worker story aligned.
  code_examples_by_version:
    '7.0':
      - config/cable.yml
    '8.0':
      - "adapter: solid_cable"
    8.1.2:
      - Turbo::StreamsChannel.broadcast_append_to
  operational_notes_by_version:
    '7.0':
      - Check Redis dependencies and custom cable deployments before migrating.
    '8.0':
      - Keep the cable database migrated and reachable in development and production.
    8.1.2:
      - Confirm cable polling and retention settings still match the app's usage pattern.
  live_demo_available: true
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.2: https://guides.rubyonrails.org/8_1_release_notes.html
- slug: solid-cache
  category: Interactive Demo
  demo_type: runtime_demo
  title: Solid Cache
  summary: Cache hit / miss を通じて、durable cache story の違いを比較できます。
  notes_by_version:
    '7.0': memory_store や Redis を環境ごとに選ぶことが多く、durable cache は標準同梱ではありませんでした。
    '8.0': Solid Cache が標準 stack に入り、DB-backed cache を採用しやすくなりました。
    8.1.2: Solid Cache は Rails 8.1 系でも durable stack の一部として継続し、queue / cable と一緒に理解しやすくなっています.
  highlights_by_version:
    '7.0': Choose cache backend yourself
    '8.0': Solid Cache arrives
    8.1.2: Durable stack remains cohesive
  status_by_version:
    '7.0': Memory or Redis cache configuration
    '8.0': DB-backed cache enters the default stack
    8.1.2: Durable cache remains part of the stack
  files_by_version:
    '7.0':
      - config/cache.yml
      - app/views/features/demos/_solid_cache.html.erb
      - app/controllers/features_controller.rb
    '8.0':
      - config/cache.yml
      - app/views/features/demos/_solid_cache.html.erb
      - app/controllers/features_controller.rb
    8.1.2:
      - config/cache.yml
      - app/views/features/demos/_solid_cache.html.erb
      - app/controllers/features_controller.rb
  upgrade_notes_by_version:
    '7.0':
      - Revisit cache backend selection if you are moving from Redis or memory store.
      - Check database capacity before shifting cache traffic into Solid Cache.
    '8.0':
      - Align `config/cache.yml` with the new durable cache story.
      - Validate cache hit / miss behavior in development and deploy environments.
    8.1.2:
      - Keep cache retention, database size, and runtime expectations aligned.
      - Re-check the app's cache keys after the upgrade.
  code_examples_by_version:
    '7.0':
      - config/cache.yml
    '8.0':
      - cache do
    8.1.2:
      - Rails.cache.fetch
  operational_notes_by_version:
    '7.0':
      - Review whether existing Redis assumptions still fit the deployment.
    '8.0':
      - Confirm the cache database and retention settings match the workload.
    8.1.2:
      - Check cache warmup, invalidation, and the database footprint together.
  live_demo_available: true
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.2: https://guides.rubyonrails.org/8_1_release_notes.html
- slug: runtime-stack
  category: Interactive Demo
  demo_type: runtime_demo
  title: Runtime stack overview
  summary: 現行 app の runtime facts を見ながら、Rails の標準 stack がどう進化したかを俯瞰できます。
  notes_by_version:
    '7.0': Hotwire は大きなテーマでしたが、queue / cache / cable / deploy は個別選定の色が強めでした。
    '8.0': Solid Queue / Cache / Cable、Kamal、Thruster などで default story が一段まとまりました。
    8.1.2: 8.1 では Continuations・Structured Event Reporting・Local CI など、運用と開発体験の story
      がさらに広がりました。
  highlights_by_version:
    '7.0': Hotwire era baseline
    '8.0': Default stack gets cohesive
    8.1.2: Operational developer experience expands
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.2: https://guides.rubyonrails.org/8_1_release_notes.html
- slug: active-job-continuations
  category: Config / Platform Differences
  demo_type: comparison_card
  title: Active Job Continuations
  summary: 長い job を step 単位で継続できる Rails 8.1 の新機能です。
  notes_by_version:
    '7.0': 中断に強い multi-step job を標準 API だけで表現するのは難しく、再開ロジックは自前で持ちがちでした。
    '8.0': Solid Queue は入りましたが、job continuation 自体はまだ標準 API ではありませんでした。
    8.1.2: ActiveJob::Continuable により step / cursor を用いた再開可能ジョブを標準で組み立てられます。
  highlights_by_version:
    '7.0': Custom resumable jobs
    '8.0': Durable queue without continuations
    8.1.2: ActiveJob::Continuable
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.2: https://guides.rubyonrails.org/8_1_release_notes.html
- slug: structured-event-reporting
  category: Config / Platform Differences
  demo_type: comparison_card
  title: Structured Event Reporting
  summary: Rails 8.1 の Event Reporter により、構造化イベントを標準インターフェースで発行できます。
  notes_by_version:
    '7.0': 構造化イベントは ActiveSupport::Notifications や独自 logger 設計に分散しやすい状態でした。
    '8.0': 運用向け default story は広がりましたが、統一的な structured event API はまだありませんでした。
    8.1.2: Rails.event.notify / tagged / set_context と subscriber により、post-processing
      向けイベントを標準化できます。
  highlights_by_version:
    '7.0': Notifications + custom logging
    '8.0': No unified event reporter yet
    8.1.2: Rails.event
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.2: https://guides.rubyonrails.org/8_1_release_notes.html
- slug: markdown-rendering
  category: Config / Platform Differences
  demo_type: comparison_card
  title: Markdown Rendering
  summary: Rails 8.1 では Markdown response / rendering をより直接扱えるようになりました。
  notes_by_version:
