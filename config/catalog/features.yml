---
features:
- slug: authentication-generator
  category: Interactive Demo
  demo_type: runtime_demo
  title: 認証ジェネレータ
  summary: Rails の標準認証機能の変化を、アカウント登録・ログイン・保護ページで確認できます。
  notes_by_version:
    '7.0': 標準の認証ジェネレータはなく、Devise などのライブラリや独自実装が必要でした。
    '8.0': 認証ジェネレータで、ユーザー・セッション・パスワード再設定の土台を作成できるようになりました。
    8.1.4: Rails 8 系の標準認証を、Current.session、リクエストの頻度制限、パスワード再設定とあわせて学習できます。
  highlights_by_version:
    '7.0': 標準の認証ジェネレータは未同梱
    '8.0': 標準の認証ジェネレータを追加
    8.1.4: Rails 8 系の認証機能を継続
  status_by_version:
    '7.0': 独自実装または外部ライブラリを選択
    '8.0': 標準ジェネレータを利用可能
    8.1.4: Rails の標準認証を利用可能
  files_by_version:
    '7.0':
    - app/controllers/concerns/authentication.rb
    - app/controllers/sessions_controller.rb
    - app/controllers/passwords_controller.rb
    - app/views/sessions/new.html.erb
    '8.0':
    - app/models/user.rb
    - app/models/session.rb
    - app/controllers/sessions_controller.rb
    - app/controllers/passwords_controller.rb
    8.1.4:
    - app/models/current.rb
    - app/models/session.rb
    - app/views/auth_labs/show.html.erb
    - app/views/passwords/edit.html.erb
  upgrade_notes_by_version:
    '7.0':
    - 独自の認証を、生成したセッション・パスワード再設定・署名付き Cookie に置き換える範囲を検討します。
    - ジェネレータを採用する前に、独自のログイン・再設定の経路を確認します。
    '8.0':
    - 生成したコントローラを、既存のログイン・再設定画面に接続します。
    - 保護ページでは、未認証でアクセスできる範囲を明確にします。
    8.1.4:
    - 更新時は Current.session と rate_limit の挙動を確認します。
    - 保護ページへのリダイレクトが既存の認証フローと一致するか確認します。
  code_examples_by_version:
    '7.0':
    - bin/rails generate authentication
    '8.0':
    - User.authenticate_by(params.permit(:email_address, :password))
    8.1.4:
    - start_new_session_for user
  operational_notes_by_version:
    '7.0':
    - 切り替え前に、独自の認証・再設定用エンドポイントを確認します。
    '8.0':
    - 再設定メールの配送と、署名付きセッション Cookie を確認します。
    8.1.4:
    - 保護ページ、リクエストの頻度制限、セッションの有効期限をまとめて再確認します。
  live_demo_available: true
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: このアプリでは Rails 8 の認証ジェネレータで作成した Current.session、パスワード再設定、署名付き Cookie を利用しています。
    detail_2: "• bin/rails generate authentication を使用"
    detail_3: "• Current.session と署名付き Cookie を利用"
    detail_4: "• User モデルで normalizes :email_address を利用"
    detail_5: "• SessionsController に rate_limit を生成"
- slug: solid-queue
  category: Interactive Demo
  demo_type: runtime_demo
  title: Solid Queue
  summary: Active Job のバックエンドの変化を、キューへの登録とジョブの状態遷移で確認できます。
  notes_by_version:
    '7.0': 標準ではプロセス内のメモリにジョブを保持します。再起動後も残す場合は別のバックエンドを選びます。
    '8.0': 新規アプリの本番構成では Solid Queue が標準となり、ジョブをデータベースに保存しやすくなりました。
    8.1.4: ジョブをデータベースに保存する Solid Queue を、Rails 8.1 系の Active Job Continuations と組み合わせられます。
  highlights_by_version:
    '7.0': 非同期処理や外部キューを選択
    '8.0': Solid Queue を標準構成に採用
    8.1.4: ジョブの継続処理と組み合わせ
  status_by_version:
    '7.0': プロセス内の処理か外部キューを選択
    '8.0': 本番環境の標準は永続キュー
    8.1.4: 永続キューと継続処理の基盤を利用
  files_by_version:
    '7.0':
    - app/controllers/queue_runs_controller.rb
    - app/jobs/queue_run_job.rb
    - config/queue.yml
    '8.0':
    - config/queue.yml
    - db/queue_schema.rb
    - bin/jobs
    8.1.4:
    - app/views/features/demos/_solid_queue.html.erb
    - app/models/queue_run.rb
    - app/jobs/queue_run_job.rb
  upgrade_notes_by_version:
    '7.0':
    - プロセス内の処理や外部キューから、ジョブを永続化するバックエンドへの移行を検討します。
    - バックグラウンド処理に依存する前に、ワーカーの起動コマンドを用意します。
    '8.0':
    - config/queue.yml と bin/jobs が開発環境・デプロイの起動経路につながっているか確認します。
    - Solid Queue を追加機能ではなく、標準のバックエンドとして扱います。
    8.1.4:
    - 継続処理、ジョブの永続性、ワーカーの並列実行数をまとめて確認します。
    - 更新後にキューの状態を確認でき、完了結果が表示されるか検証します。
  code_examples_by_version:
    '7.0':
    - bin/jobs start
    '8.0':
    - config.active_job.queue_adapter = :solid_queue
    8.1.4:
    - QueueRunJob.perform_later(queue_run.id)
  operational_notes_by_version:
    '7.0':
    - ジョブを有効にする前に、独立したワーカープロセスが必要か確認します。
    '8.0':
    - bin/jobs start または同等のコマンドでワーカーを常時稼働させます。
    8.1.4:
    - 保存したジョブの実行と Turbo Stream による画面更新を一緒に確認します。
  adoption_when:
  - Redis ベースのジョブ基盤を先に追加せず、Rails の Active Job でジョブを永続化したい場合。
  - データベースに運用用データを保存でき、独立したワーカープロセスを稼働できる場合。
  - リリースノートだけでなく、アプリのコード・スキーマ・実行画面からキューの挙動を確認したい場合。
  adoption_cautions:
  - ワーカーの起動、キューのスキーマ、再試行、運用責任を確認するまでは、そのまま置き換えられると考えないでください。
  - Sidekiq のキュー、ミドルウェア、監視画面、Redis に依存する運用がある場合は移行に注意が必要です。
  - このカタログでは、本番で Solid Queue から別のバックエンドへ切り戻す手順は未検証です。
  adoption_alternatives:
  - Redis を使ったジョブ運用が定着している場合は、Sidekiq も有力な選択肢です。
  - ローカルだけの確認や永続性が不要な開発用途では、async アダプタで足りる場合があります。
  adoption_requirements:
  - config/queue.yml と db/queue_schema.rb を、想定するキュー構成に合わせます。
  - bin/jobs または同等のワーカー起動コマンドを、開発・デプロイのプロセス管理に組み込みます。
  - 本番利用前に queued、working、failed、completed の各状態を監視できるようにします。
  live_demo_available: true
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: 'Procfile.dev に jobs: bin/jobs start を指定しているため、ローカル起動時にワーカーも起動します。'
- slug: solid-cable
  category: Interactive Demo
  demo_type: runtime_demo
  title: Solid Cable
  summary: Turbo Stream の画面更新を操作し、データベースを使う Action Cable の構成を比較できます。
  notes_by_version:
    '7.0': Action Cable は Redis を使う構成が一般的で、データベースを使う構成は標準では主流でありませんでした。
    '8.0': Solid Cable が Rails 8 の標準構成に入り、データベースによるリアルタイム配信を選びやすくなりました。
    8.1.4: Solid Queue・Solid Cache とあわせ、1つのアプリでキュー・キャッシュ・リアルタイム配信を揃えやすい構成を継続しています。
  highlights_by_version:
    '7.0': Redis を中心とする配信構成
    '8.0': Solid Cable を標準構成に採用
    8.1.4: データベースによる配信を継続
  status_by_version:
    '7.0': Redis または独自の Action Cable 構成
    '8.0': データベースによる配信が標準構成に追加
    8.1.4: データベースによる配信を継続
  files_by_version:
    '7.0':
    - config/cable.yml
    - app/views/features/demos/_solid_cable.html.erb
    - app/controllers/features_controller.rb
    '8.0':
    - config/cable.yml
    - app/views/features/demos/_solid_cable.html.erb
    - app/controllers/features_controller.rb
    8.1.4:
    - config/cable.yml
    - app/views/features/demos/_solid_cable.html.erb
    - app/controllers/features_controller.rb
  upgrade_notes_by_version:
    '7.0':
    - Rails の標準構成を使う場合、Redis が必要という前提を見直します。
    - 利用環境で配信をデータベースに移せるか確認します。
    '8.0':
    - config/cable.yml と配信用データベースの設定をあわせて確認します。
    - アダプタの切り替え後に配信経路を再確認します。
    8.1.4:
    - Turbo Stream の更新、メッセージの保持期間、データベースのポーリングをまとめて確認します。
    - 配信用データベースと実行プロセスの構成を揃えます。
  code_examples_by_version:
    '7.0':
    - config/cable.yml
    '8.0':
    - 'adapter: solid_cable'
    8.1.4:
    - Turbo::StreamsChannel.broadcast_append_to
  operational_notes_by_version:
    '7.0':
    - 移行前に Redis への依存と独自の配信構成を確認します。
    '8.0':
    - 開発・本番の両方で、配信用データベースのスキーマと接続を維持します。
    8.1.4:
    - ポーリングと保持期間の設定が利用状況に合っているか確認します。
  live_demo_available: true
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: 別タブを開いたまま投稿すると、Turbo Stream 経由でメッセージ一覧が同期されます。
- slug: solid-cache
  category: Interactive Demo
  demo_type: runtime_demo
  title: Solid Cache
  summary: キャッシュのヒット・ミスを操作して、データを永続化するキャッシュの構成を比較できます。
  notes_by_version:
    '7.0': memory_store や Redis を環境ごとに選ぶことが多く、永続化するキャッシュは標準同梱ではありませんでした。
    '8.0': Solid Cache が標準構成に入り、データベースを使うキャッシュを採用しやすくなりました。
    8.1.4: Rails 8.1 系でも Solid Cache を標準構成の一部として継続し、Solid Queue・Solid Cable とあわせて学習できます。
  highlights_by_version:
    '7.0': キャッシュの保存先を個別に選択
    '8.0': Solid Cache を標準構成に採用
    8.1.4: 永続化する標準構成を継続
  status_by_version:
    '7.0': メモリまたは Redis のキャッシュ構成
    '8.0': データベースを使うキャッシュを標準構成に追加
    8.1.4: 永続キャッシュを標準構成として継続
  files_by_version:
    '7.0':
    - config/cache.yml
    - app/views/features/demos/_solid_cache.html.erb
    - app/controllers/features_controller.rb
    '8.0':
    - config/cache.yml
    - app/views/features/demos/_solid_cache.html.erb
    - app/controllers/features_controller.rb
    8.1.4:
    - config/cache.yml
    - app/views/features/demos/_solid_cache.html.erb
    - app/controllers/features_controller.rb
  upgrade_notes_by_version:
    '7.0':
    - Redis やメモリから移行する際は、保存先の選択を見直します。
    - キャッシュのアクセスを Solid Cache に移す前に、データベースの容量を確認します。
    '8.0':
    - config/cache.yml を永続キャッシュの構成に合わせます。
    - 開発環境とデプロイ先で、キャッシュのヒット・ミスを確認します。
    8.1.4:
    - 保持期間、データベースの容量、実行時の要件を揃えます。
    - 更新後にアプリのキャッシュキーを再確認します。
  code_examples_by_version:
    '7.0':
    - config/cache.yml
    '8.0':
    - cache do
    8.1.4:
    - Rails.cache.fetch
  operational_notes_by_version:
    '7.0':
    - 既存の Redis を前提とした運用が、移行先にも適しているか確認します。
    '8.0':
    - キャッシュ用データベースと保持期間を、実際の負荷に合わせます。
    8.1.4:
    - キャッシュの事前生成・無効化と、データベース使用量をまとめて確認します。
  adoption_when:
  - キャッシュの保存だけを目的に Redis を追加せず、Rails の構成でキャッシュを永続化したい場合。
  - データベースをキャッシュの保存先にでき、保持期間の方針が明確な場合。
  - Rails.cache の呼び出し、キー、実行時のヒット・ミスからキャッシュの挙動を確認したい場合。
  adoption_cautions:
  - データベースの容量、保持期間、削除処理を把握するまでは、キャッシュのアクセスをデータベースに移さないでください。
  - Redis の指標、メモリ不足時の削除動作、キャッシュ専用ツールに本番運用が依存する場合は注意が必要です。
  - このカタログでは、本番のキャッシュ負荷や、Solid Cache から Redis・memory_store への切り戻しは未検証です。
  adoption_alternatives:
  - Redis を運用していて、そのメモリ管理や監視の仕組みに依存する場合は Redis も適しています。
  - 永続性が不要な小規模の開発用確認では、memory_store で足りる場合があります。
  adoption_requirements:
  - config/cache.yml に、想定するキャッシュ用データベースと保存方法を定義します。
  - 本番利用前に、キャッシュ用テーブルの容量、有効期限、削除処理を監視できるようにします。
  - Redis やメモリから移行する際は、キャッシュキーと無効化の経路を再確認します。
  live_demo_available: true
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: 保存データはキャッシュミスが起きたときだけ再生成されます。
- slug: runtime-stack
  category: Interactive Demo
  demo_type: runtime_demo
  title: 実行環境の構成
  summary: 現在のアプリの設定と実行状況から、Rails の標準構成の変化を確認できます。
  notes_by_version:
    '7.0': Hotwire が大きなテーマとなる一方、キュー・キャッシュ・配信・デプロイは個別に選択する場面が多くありました。
    '8.0': Solid Queue・Solid Cache・Solid Cable、Kamal、Thruster により標準構成がまとまりました。
    8.1.4: Rails 8.1 系では Active Job Continuations・Structured Event Reporting・Local CI など、運用と開発体験が広がりました。
  highlights_by_version:
    '7.0': Hotwire を中心とする構成
    '8.0': 標準構成がまとまる
    8.1.4: 運用と開発体験が拡充
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: この画面では Rails 8 の標準構成が、このアプリでどう使われているかを確認できます。認証、Solid Queue、Solid Cable、Solid Cache、デプロイの比較ページもあわせて確認してください。
- slug: active-job-continuations
  category: Config / Platform Differences
  demo_type: comparison_card
  title: Active Job Continuations
  summary: Rails 8.1 で追加された、長いジョブをステップ単位で継続できる機能です。
  notes_by_version:
    '7.0': 複数ステップに分けたジョブを中断後に再開するには、標準 API 以外の仕組みや独自の再開ロジックが必要でした。
    '8.0': Solid Queue は導入されましたが、ジョブの継続処理はまだ標準 API ではありませんでした。
    8.1.4: ActiveJob::Continuable のステップとカーソルで、再開可能なジョブを作成できます。8.1.4 では、エラー後の再開時に例外が正しく記録されるよう修正されています。
  highlights_by_version:
    '7.0': 再開可能なジョブを独自実装
    '8.0': 永続キューを採用、継続処理は未同梱
    8.1.4: ActiveJob::Continuable
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: >-
      Rails 8.1 では ActiveJob::Continuable で長いジョブをステップに分け、中断後に再開できます。Rails 7.0 では再開位置の管理を独自に実装することが多く、Rails 8.0 では永続キューはあっても継続処理の
      API は未同梱でした。
- slug: structured-event-reporting
  category: Config / Platform Differences
  demo_type: comparison_card
  title: Structured Event Reporting
  summary: Rails 8.1 の Event Reporter で、構造化イベントを統一したインターフェースから発行できます。
  notes_by_version:
    '7.0': 構造化イベントの処理は ActiveSupport::Notifications や独自のログ設計に分散しがちでした。
    '8.0': 運用向けの標準構成は広がりましたが、構造化イベントの統一 API は未同梱でした。
    8.1.4: Rails.event.notify、tagged、set_context とサブスクライバを使い、後続処理用のイベントを標準化できます。
  highlights_by_version:
    '7.0': Notifications と独自のログ設計
    '8.0': 統一した Event Reporter は未同梱
    8.1.4: Rails.event
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: >-
      Rails 8.1 では Rails.event で構造化イベントを発行・購読できます。Rails 7.0・8.0 では ActiveSupport::Notifications や独自のログ設計に分散しがちだった処理です。
    detail_2: 監視・分析用のイベントデータを、アプリのコードから統一して送信しやすくなります。
- slug: markdown-rendering
  category: Config / Platform Differences
  demo_type: comparison_card
  title: Markdown Rendering
  summary: Rails 8.1 では Markdown のレスポンスとレンダリングを直接扱いやすくなりました。
  notes_by_version:
    '7.0': Markdown のレスポンスは gem や独自のレスポンダによる拡張が必要になることが多くありました。
