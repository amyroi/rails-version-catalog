- slug: kamal
  category: Config / Platform Differences
  demo_type: comparison_card
  title: Kamal によるデプロイ
  summary: Kamal が Rails アプリの標準的なデプロイ構成に加わるまでの変化を比較します。
  notes_by_version:
    '7.0': Capistrano、独自の CI/CD、PaaS などに依存するデプロイが中心でした。
    '8.0': Kamal が Gemfile や設定に加わり、自分で管理するサーバーへのデプロイをアプリに組み込みやすくなりました。
    8.1.4: コンテナレジストリを使わない Kamal のデプロイが追加され、初回デプロイの準備が簡素になりました。
  highlights_by_version:
    '7.0': アプリのチームがデプロイ方式を選択
    '8.0': Kamal を統合
    8.1.4: レジストリなしの Kamal デプロイ
  status_by_version:
    '7.0': Custom deploy pipelines dominate
    '8.0': Kamal becomes part of the default deploy story
    8.1.4: Registry-free deploy is available
  files_by_version:
    '7.0':
    - config/deploy.yml
    - ".kamal/secrets"
    - app/views/features/demos/_kamal.html.erb
    '8.0':
    - config/deploy.yml
    - ".kamal/secrets"
    - app/views/features/demos/_kamal.html.erb
    8.1.4:
    - config/deploy.yml
    - ".kamal/secrets"
    - app/views/features/demos/_kamal.html.erb
  upgrade_notes_by_version:
    '7.0':
    - Replace bespoke deploy pipelines with a repeatable app-centric deploy flow.
    - Review secrets handling before moving to Kamal.
    '8.0':
    - Keep `config/deploy.yml` and `.kamal/secrets` in sync with the deploy target.
    - Decide whether the new deploy story should own registry and proxy settings.
    8.1.4:
    - Check registry-free deploy and production defaults before rolling forward.
    - Revisit secret and image host handling as part of the upgrade.
  code_examples_by_version:
    '7.0':
    - bin/kamal deploy
    '8.0':
    - config/deploy.yml
    8.1.4:
    - rails credentials:fetch
  operational_notes_by_version:
    '7.0':
    - Keep deploy secrets and server inventory separately documented.
    '8.0':
    - Verify the deploy image host, proxy, and secret settings together.
    8.1.4:
    - Re-check registry-free deploy assumptions before production rollout.
  adoption_when:
  - >-
    You want an app-centric deploy flow where container image, server inventory, proxy, and secrets are reviewed
    from the Rails repository.
  - The team is comfortable owning self-hosted deployment operations instead of relying entirely on a PaaS.
  - >-
    Deploy behavior should be inspected through `config/deploy.yml`, `.kamal/secrets`, Docker image settings, and
    runtime commands.
  adoption_cautions:
  - >-
    Avoid treating Kamal as only a generated config file; server access, registry auth, proxy settings, and rollback
    behavior all need operational ownership.
  - >-
    Be careful when existing Capistrano, PaaS, or CI/CD deploy flows already encode environment-specific safety
    checks.
  - This catalog has not yet verified a production rollback or registry-free deploy flow end to end.
  adoption_alternatives:
  - Capistrano remains a familiar option for SSH-based deployments without adopting Kamal's container workflow.
  - PaaS platforms can still be preferable when the team wants less server and proxy ownership.
  - Existing CI/CD pipelines may remain the safer path if they already cover secrets, approvals, and rollback.
  adoption_requirements:
  - "`config/deploy.yml` needs real server, image, proxy, and environment settings before it is production-ready."
  - >-
    `.kamal/secrets` should read from ENV or a password manager instead of local files such as `config/master.key`
    before treating the deploy path as public-safe.
  - >-
    Registry credentials, `RAILS_MASTER_KEY`, and rollback commands should be tested together before relying on
    Kamal for production work.
  live_demo_available: true
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
