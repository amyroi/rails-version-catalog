    - app/controllers/features_controller.rb
    '8.0':
    - config/cache.yml
    - app/views/features/demos/_solid_cache.html.erb
    - app/controllers/features_controller.rb
    8.1.4:
    - config/cache.yml
    - app/views/features/demos/_solid_cache.html.erb
    - app/controllers/features_controller.rb
  upgrade_notes_by_version:
    '7.0':
    - Redis やメモリーストアから移行する場合は、バックエンドの選定を見直します。
    - キャッシュへのアクセスを Solid Cache に移す前に、データベース容量を確認します。
    '8.0':
    - "`config/cache.yml` を永続キャッシュの構成に合わせます。"
    - 開発・デプロイ環境でキャッシュのヒット／ミスの挙動を検証します。
    8.1.4:
    - キャッシュの保持期間・データベースのサイズ・実行時の期待動作を整合させます。
    - 更新後にアプリのキャッシュキーを再確認します。
  code_examples_by_version:
