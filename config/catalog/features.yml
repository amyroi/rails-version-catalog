- slug: active-job-continuations
  category: Config / Platform Differences
  demo_type: comparison_card
  title: Active Job の継続処理（Continuations）
  summary: 長いジョブをステップ単位で継続できる Rails 8.1 の新機能です。
  notes_by_version:
    '7.0': 中断に強い複数ステップのジョブを標準 API だけで表現するのは難しく、再開ロジックは独自実装になりがちでした。
    '8.0': Solid Queue は導入されましたが、ジョブの継続処理はまだ標準 API ではありませんでした。
    8.1.4: ActiveJob::Continuable により、ステップとカーソルを用いた再開可能ジョブを標準で組み立てられます。8.1.4 ではエラー後の再開時に例外が正しく記録されるよう修正されています。
  highlights_by_version:
    '7.0': 再開可能なジョブを独自実装
    '8.0': 永続キューはあるが継続処理は未対応
    8.1.4: ActiveJob::Continuable による継続処理
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: >-
      Rails 8.1 では `ActiveJob::Continuable` により、長いジョブをステップごとに再開可能な形で組み立てやすくなりました。 7.0 では再開位置の管理をジョブ側で独自実装することが多く、8.0
      では永続キューはあっても継続処理の API はありませんでした。
- slug: structured-event-reporting
  category: Config / Platform Differences
  demo_type: comparison_card
  title: 構造化イベント報告
  summary: Rails 8.1 の Event Reporter により、構造化イベントを標準インターフェースで発行できます。
  notes_by_version:
    '7.0': 構造化イベントは ActiveSupport::Notifications や独自のログ設計に分散しやすい状態でした。
    '8.0': 運用向けの標準構成は広がりましたが、統一的な構造化イベント API はまだありませんでした。
    8.1.4: Rails.event.notify / tagged / set_context と購読処理（subscriber）により、後処理向けのイベントを標準化できます。
  highlights_by_version:
    '7.0': Notifications と独自ログ
    '8.0': 統一的なイベント報告機能は未導入
    8.1.4: Rails.event によるイベント報告
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: >-
      Rails 8.1 では `Rails.event` を使って、構造化イベントを標準インターフェースで発行・購読できるようになりました。 7.0 / 8.0 では `ActiveSupport::Notifications`
      や 独自のログ処理に散らばりやすかった部分です。
    payload: 監視・分析向けのデータを、アプリのコードから統一した形で出力しやすくなります。
- slug: markdown-rendering
  category: Config / Platform Differences
  demo_type: comparison_card
  title: Markdown の描画
  summary: Rails 8.1 では Markdown のレスポンスと描画を、より直接扱えるようになりました。
  notes_by_version:
    '7.0': Markdown のレスポンスは、gem や独自のレスポンス処理による拡張が前提になりがちでした。
    '8.0': 標準の描画処理は引き続き HTML / JSON が中心でした。
    8.1.4: 'respond_to の中で render markdown: object を使う方法が、公式リリースノートに登場しました。'
  highlights_by_version:
    '7.0': Markdown の描画を独自に拡張
    '8.0': Markdown レスポンスの標準対応は未導入
    8.1.4: 'render markdown: による描画'
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: >-
      Rails 8.1 のリリースノートでは、`render markdown:` を使うレスポンスの返し方が紹介されています。 以前は Markdown を返すために gem や独自の描画処理を追加する設計になりがちでした。
- slug: local-ci
  category: Config / Platform Differences
  demo_type: comparison_card
  title: ローカル CI（Local CI）
  summary: Rails 8.1 の Local CI DSL は、クラウド CI 以外の軽量な標準実行方法を提供します。
  notes_by_version:
    '7.0': CI は GitHub Actions や CircleCI などのクラウド向け設定ファイルが中心でした。
    '8.0': 新規アプリに CI ワークフローは含まれますが、ローカル実行を前提とした DSL はありませんでした。
    8.1.4: config/ci.rb と bin/ci によって、開発者の端末で CI の処理を宣言・実行する標準の仕組みが導入されました。
  highlights_by_version:
    '7.0': クラウド CI が中心
    '8.0': CI ワークフローを生成
    8.1.4: config/ci.rb と bin/ci によるローカル実行
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: 7.0 はクラウド CI が前提、8.0 は生成されたワークフローが中心、8.1 では `config/ci.rb` と `bin/ci` による ローカル実行を優先する手順が加わります。
- slug: credentials-fetching
  category: Config / Platform Differences
  demo_type: comparison_card
  title: コマンドラインからの認証情報取得
  summary: Rails 8.1 では、コマンドラインから認証情報（credentials）を取得するデプロイ手順が強化されました。
  notes_by_version:
    '7.0': 認証情報は Rails 内で読む前提が強く、デプロイとの連携は独自スクリプトになりがちでした。
    '8.0': Kamal は組み込まれましたが、credentials fetch を前提にしたコマンドライン操作はまだ限定的でした。
    8.1.4: rails credentials:fetch が紹介され、Kamal のシークレットと暗号化された認証情報を連携しやすくなりました。
  highlights_by_version:
    '7.0': シークレット取得を独自スクリプトで実装
    '8.0': Kamal が導入
    8.1.4: rails credentials:fetch による取得
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: >-
      `rails credentials:fetch` により、暗号化された認証情報をデプロイツールと連携させる、コマンドライン操作の流れが分かりやすくなります。 Kamal と組み合わせたシークレット取得の整理に向いた変更です。
- slug: deprecated-associations
  category: Config / Platform Differences
  demo_type: comparison_card
  title: 関連付けの非推奨化
  summary: Rails 8.1 では、関連付け自体を非推奨として宣言し、利用状況を報告できます。
  notes_by_version:
    '7.0': 関連付けの利用抑制や移行警告は、静的解析や独自の警告処理に頼ることが多かったです。
    '8.0': 関連付けの非推奨化を報告する標準機能はまだありませんでした。
    8.1.4: 'has_many :posts, deprecated: true のように、関連付け自体を非推奨にできます。'
  highlights_by_version:
    '7.0': 移行警告を独自実装
    '8.0': 関連付けの非推奨化は標準未対応
    8.1.4: 'deprecated: true による非推奨化'
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: Rails 8.1 では関連付け自体を非推奨にできるため、大きなスキーマ移行や API 整理の途中でも、 どの関連がまだ参照されているかを、アプリ側で把握しやすくなります。
- slug: propshaft
  category: Config / Platform Differences
  demo_type: comparison_card
  title: Propshaft
  summary: アセットパイプラインが、Sprockets の任意依存化から Propshaft の標準採用へ変化した流れを整理します。
  notes_by_version:
    '7.0': Sprockets は任意の依存になりましたが、アセットパイプラインの比較では依然として Sprockets が中心でした。
    '8.0': 新規アプリは Propshaft が前提になり、より軽量なアセット管理になりました。
    8.1.4: Propshaft を前提とする構成は継続し、importmap / Hotwire と組み合わせた軽量構成を保ちやすくなっています。
  highlights_by_version:
    '7.0': Sprockets が任意依存に
    '8.0': Propshaft が標準に
    8.1.4: Propshaft を基本構成として継続
  status_by_version:
    '7.0': 比較の中心は引き続き Sprockets
    '8.0': Propshaft が標準のアセット構成に
    8.1.4: Propshaft を基本構成として継続
  files_by_version:
    '7.0':
    - config/importmap.rb
    - app/views/features/demos/_propshaft.html.erb
    - app/controllers/features_controller.rb
    '8.0':
    - config/importmap.rb
    - app/views/features/demos/_propshaft.html.erb
    - app/controllers/features_controller.rb
    8.1.4:
    - config/importmap.rb
    - app/views/features/demos/_propshaft.html.erb
    - app/controllers/features_controller.rb
  upgrade_notes_by_version:
    '7.0':
    - Propshaft の採用前に、Sprockets 固有の前提を整理します。
    - アセットのフィンガープリントと importmap の組み合わせを確認します。
    '8.0':
    - 新しい標準アセットパイプラインが、起動・デプロイに組み込まれているか確認します。
    - 移行前に Sprockets 固有のヘルパーやアセット設定を見直します。
    8.1.4:
    - アセット更新時には importmap と Propshaft の整合性を保ちます。
    - バージョン更新のたびに、フィンガープリント付きアセットの挙動を再確認します。
  code_examples_by_version:
    '7.0':
    - config/importmap.rb
    '8.0':
    - Propshaft enabled
    8.1.4:
    - importmap + Propshaft
  operational_notes_by_version:
    '7.0':
    - ヘルパーやアセット読み込み先に、Sprockets 前提の処理がないか点検します。
    '8.0':
    - アセットの事前コンパイルとフィンガープリント付きファイルの処理を確認します。
    8.1.4:
    - デプロイやキャッシュ無効化の変更後に、アセット配信を再検証します。
  live_demo_available: true
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: Rails 8 の新規アプリでは、Propshaft が標準のアセットパイプラインとして組み込まれています。
    sprockets: Sprockets 前提の複雑さが減る
    fingerprint: フィンガープリント／ダイジェスト（内容を識別する値）の利用は維持
    importmap: importmap + Propshaft との相性が良い
- slug: kamal
  category: Config / Platform Differences
  demo_type: comparison_card
  title: Kamal によるデプロイ
  summary: Kamal が Rails アプリのデプロイ構成に組み込まれた流れを比較します。
  notes_by_version:
    '7.0': デプロイは Capistrano・独自の CI/CD・PaaS に依存しがちでした。
    '8.0': Kamal が Gemfile と設定に入り、自前サーバーへのデプロイ手順がアプリに近づきました。
    8.1.4: レジストリ不要の Kamal デプロイが追加され、初回デプロイの手順がさらに軽くなりました。
  highlights_by_version:
    '7.0': デプロイは各チームで設計
    '8.0': Kamal が標準構成に統合
    8.1.4: レジストリ不要の Kamal デプロイ
  status_by_version:
    '7.0': 独自のデプロイ処理が中心
    '8.0': Kamal が標準デプロイ構成の一部に
    8.1.4: レジストリ不要のデプロイに対応
  files_by_version:
    '7.0':
    - config/deploy.yml
    - ".kamal/secrets"
    - app/views/features/demos/_kamal.html.erb
    '8.0':
    - config/deploy.yml
    - ".kamal/secrets"
    - app/views/features/demos/_kamal.html.erb
    8.1.4:
    - config/deploy.yml
    - ".kamal/secrets"
    - app/views/features/demos/_kamal.html.erb
  upgrade_notes_by_version:
    '7.0':
    - 独自のデプロイ処理を、アプリ中心の再現可能な手順に置き換えます。
    - Kamal への移行前に、シークレットの取り扱いを見直します。
    '8.0':
    - "`config/deploy.yml` と `.kamal/secrets` をデプロイ先に合わせます。"
    - 新しいデプロイ手順で、レジストリとプロキシの設定まで管理するか決めます。
    8.1.4:
    - 更新前に、レジストリ不要のデプロイと本番環境の標準設定を確認します。
    - 更新の一環として、シークレットとイメージ配信先の扱いを見直します。
  code_examples_by_version:
    '7.0':
    - bin/kamal deploy
    '8.0':
    - config/deploy.yml
    8.1.4:
    - rails credentials:fetch
  operational_notes_by_version:
    '7.0':
    - デプロイ用シークレットとサーバー一覧を、それぞれ文書化しておきます。
    '8.0':
    - デプロイするイメージの配信先・プロキシ・シークレットの設定をまとめて検証します。
    8.1.4:
    - 本番への適用前に、レジストリ不要のデプロイの前提を再確認します。
  adoption_when:
  - コンテナーイメージ・サーバー一覧・プロキシ・シークレットを Rails リポジトリで確認できる、アプリ中心のデプロイ手順を使いたい場合。
  - PaaS に全面依存せず、自前サーバーへのデプロイをチームで運用できる場合。
  - "`config/deploy.yml`・`.kamal/secrets`・Docker イメージ設定・実行コマンドからデプロイの挙動を確認したい場合。"
  adoption_cautions:
  - Kamal を生成済み設定ファイルだけと捉えないでください。サーバーアクセス・レジストリ認証・プロキシ設定・切り戻しには運用責任が必要です。
  - 既存の Capistrano・PaaS・CI/CD のデプロイ手順に、環境固有の安全確認が組み込まれている場合は注意が必要です。
  - このカタログでは、本番環境での切り戻しやレジストリ不要のデプロイを、一連の手順としては未検証です。
  adoption_alternatives:
  - Kamal のコンテナー構成を採用せず SSH でデプロイしたい場合は、Capistrano も馴染みのある選択肢です。
  - サーバーやプロキシの管理負担を抑えたい場合は、PaaS が適することもあります。
  - 既存の CI/CD がシークレット・承認・切り戻しを扱えている場合は、その手順を維持する方が安全なこともあります。
  adoption_requirements:
  - 本番利用前に、`config/deploy.yml` に実際のサーバー・イメージ・プロキシ・環境設定を記載する必要があります。
  - デプロイ手順を安全に公開するには、`.kamal/secrets` は `config/master.key` などのローカルファイルではなく、環境変数やパスワードマネージャーから読み込むようにします。
  - 本番利用前に、レジストリの認証情報・`RAILS_MASTER_KEY`・切り戻しコマンドをまとめて検証します。
  live_demo_available: true
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: >-
      Rails 8.0 でアプリに組み込まれた Kamal のデプロイ構成は、8.1 ではレジストリ不要のデプロイにまで広がります。 7.0 時代の「デプロイは各チームで別設計」と比べると、比較対象としてかなり扱いやすくなりました。
- slug: thruster
  category: Config / Platform Differences
