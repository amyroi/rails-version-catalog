  operational_notes_by_version:
    '7.0':
    - 既存の Redis を前提とした設計が、デプロイ構成に合っているか見直します。
    '8.0':
    - キャッシュ用データベースと保持設定が、負荷に合っているか確認します。
    8.1.4:
    - キャッシュの事前生成・無効化・データベースの使用量をまとめて確認します。
