- slug: credentials-fetching
  category: Config / Platform Differences
  demo_type: comparison_card
  title: Command-line Credentials Fetching
  summary: Rails 8.1 では、コマンドラインで credentials を取得し、デプロイに利用しやすくなりました。
  notes_by_version:
    '7.0': credentials は Rails 内で読むことが多く、デプロイとの連携には独自のスクリプトが必要になりがちでした。
    '8.0': Kamal は標準構成に加わりましたが、credentials の取得を前提とするコマンドラインの利用手順はまだ限られていました。
