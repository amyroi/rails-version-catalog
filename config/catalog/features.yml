  - キャッシュ保存のためだけに Redis を導入せず、Rails 標準に沿った永続キャッシュを使いたい場合。
  - データベースにキャッシュを保存でき、明確な保持方針がある場合。
  - "`Rails.cache` の使い方・キー・実行時のヒット／ミスを通じて挙動を確認したい場合。"
  adoption_cautions:
