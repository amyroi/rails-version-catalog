---
features:
- slug: authentication-generator
  category: Interactive Demo
  demo_type: runtime_demo
  title: 認証ジェネレーター
  summary: Rails の標準認証の変化を、アカウント作成・ログイン・保護ページで確認できます。
  notes_by_version:
    '7.0': 標準の認証ジェネレーターは同梱されておらず、Devise などの外部ライブラリや手作業での実装が中心でした。
    '8.0': generate authentication で User・Session・パスワード再設定の土台を作れるようになりました。
    8.1.4: 認証ジェネレーターは Rails 8 系の標準的な導線として定着し、Current.session・rate_limit・パスワード再設定とあわせて学べます。
  highlights_by_version:
    '7.0': 公式の認証ジェネレーターは未同梱
    '8.0': 公式の認証ジェネレーターが登場
    8.1.4: Rails 8 の認証の土台を継続
  status_by_version:
    '7.0': 独自実装または外部ライブラリによる認証
    '8.0': 公式ジェネレーターによる認証の土台
    8.1.4: Rails 標準の認証構成を継続
  files_by_version:
    '7.0':
    - app/controllers/concerns/authentication.rb
    - app/controllers/sessions_controller.rb
    - app/controllers/passwords_controller.rb
    - app/views/sessions/new.html.erb
    '8.0':
    - app/models/user.rb
    - app/models/session.rb
    - app/controllers/sessions_controller.rb
    - app/controllers/passwords_controller.rb
    8.1.4:
    - app/models/current.rb
    - app/models/session.rb
    - app/views/auth_labs/show.html.erb
    - app/views/passwords/edit.html.erb
  upgrade_notes_by_version:
    '7.0':
    - 独自の認証を、生成されたセッション管理・パスワード再設定・署名付き Cookie を使う構成に置き換えます。
    - ジェネレーターの採用前に、独自のログイン・パスワード再設定処理を点検します。
    '8.0':
    - 生成されたコントローラーを既存のログイン・パスワード再設定画面に組み込みます。
    - 保護ページでは、未認証でアクセスできる範囲を明確にします。
    8.1.4:
    - 更新時には `Current.session` と `rate_limit` の挙動を確認します。
    - 保護ページへのリダイレクトが、アプリの認証フローと一致するか確認します。
  code_examples_by_version:
    '7.0':
    - bin/rails generate authentication
    '8.0':
    - User.authenticate_by(params.permit(:email_address, :password))
    8.1.4:
    - start_new_session_for user
  operational_notes_by_version:
    '7.0':
    - 切り替え前に、独自の認証・パスワード再設定エンドポイントに不足がないか確認します。
    '8.0':
    - パスワード再設定メールの配送と署名付きセッション Cookie を確認します。
    8.1.4:
    - 保護ページ・アクセス頻度制限・セッションの有効期限をまとめて再検証します。
  live_demo_available: true
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: Rails 8 の認証ジェネレーターが作るセッション管理・パスワード再設定・安全な Cookie の仕組みを、このアプリで使っています。
    generate: "`bin/rails generate authentication` を使用"
    session_cookie: "`Current.session` と署名付き Cookie を利用"
    normalize: "`normalizes :email_address` を User モデルで利用"
    rate_limit: "`rate_limit` が SessionsController に生成済み（アクセス頻度を制限）"
    files: User、Session、Authentication（認証の共通処理）、PasswordsMailer
- slug: solid-queue
  category: Interactive Demo
  demo_type: runtime_demo
  title: Solid Queue
  summary: Active Job のバックエンドの変化を、ジョブ投入と状態遷移の画面で確認できます。
  notes_by_version:
    '7.0': 既定はプロセス内で動作する非永続のバックエンドであり、永続化するキューは別途選定する必要がありました。
    '8.0': Solid Queue が本番環境の標準構成に入り、データベースを使ったキューを採用しやすくなりました。
    8.1.4: 継続処理（Continuations）と組み合わせやすい永続化バックエンドとして、Rails 8.1 系の新機能の土台にもなります。
  highlights_by_version:
    '7.0': 非同期アダプターまたは外部キューを選定
    '8.0': Solid Queue が登場
    8.1.4: 継続処理と組み合わせられる永続キュー
  status_by_version:
    '7.0': プロセス内キューまたは外部キューを選定
    '8.0': 本番環境で永続キューが標準に
    8.1.4: 継続処理の土台となる永続キュー
  files_by_version:
    '7.0':
    - app/controllers/queue_runs_controller.rb
    - app/jobs/queue_run_job.rb
    - config/queue.yml
    '8.0':
    - config/queue.yml
    - db/queue_schema.rb
    - bin/jobs
    8.1.4:
    - app/views/features/demos/_solid_queue.html.erb
    - app/models/queue_run.rb
    - app/jobs/queue_run_job.rb
  upgrade_notes_by_version:
    '7.0':
    - プロセス内キューや外部キューから、永続化するキューバックエンドへの移行を検討します。
    - バックグラウンド処理を利用する前に、ワーカーの起動コマンドを追加します。
    '8.0':
    - "`config/queue.yml` と `bin/jobs` がローカル開発とデプロイの手順に組み込まれているか確認します。"
    - Solid Queue を追加機能ではなく標準バックエンドとして捉えます。
    8.1.4:
    - 継続処理・キューの永続性・ワーカーの並列実行数をまとめて確認します。
    - 更新後にキューの状態表示と完了通知を検証します。
  code_examples_by_version:
    '7.0':
    - bin/jobs start
    '8.0':
    - config.active_job.queue_adapter = :solid_queue
    8.1.4:
    - QueueRunJob.perform_later(queue_run.id)
  operational_notes_by_version:
    '7.0':
    - ジョブを有効にする前に、独立したワーカープロセスが必要か確認します。
    '8.0':
    - "`bin/jobs start` または同等のワーカー起動コマンドを実行し続けます。"
    8.1.4:
    - 永続キューの処理と Turbo Stream による表示更新をまとめて検証します。
  adoption_when:
  - Redis を使うジョブシステムを先に追加せず、Rails 標準に沿った永続的な Active Job 処理を使いたい場合。
  - アプリがデータベースを使った運用基盤を受け入れられ、独立したワーカープロセスを実行できる場合。
  - リリースノートだけでなく、Rails のコード・スキーマ・実行画面からキューの挙動を確認したい場合。
  adoption_cautions:
  - ワーカー起動・キューのスキーマ・リトライ・運用責任を確認するまでは、既存基盤をそのまま置き換えられると考えないでください。
  - キュー・ミドルウェア・ダッシュボード・Redis を使った運用手順が整備された Sidekiq 環境からの移行には注意が必要です。
  - このカタログでは、本番環境で Solid Queue から別のバックエンドへ切り戻す手順は未検証です。
  adoption_alternatives:
  - Redis を使ったジョブ運用にすでに依存している場合は、Sidekiq も有力な選択肢です。
  - ローカル限定で永続化が不要な開発確認には、async アダプターで十分な場合もあります。
  adoption_requirements:
  - "`config/queue.yml` と `db/queue_schema.rb` を、意図するキュー構成に合わせる必要があります。"
  - "`bin/jobs` または同等のワーカー起動コマンドを、ローカル・デプロイ両方のプロセス管理に含める必要があります。"
  - 本番利用前に、待機中・処理中・失敗・完了のジョブ状態を監視できるようにします。
  live_demo_available: true
  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
    description: "`Procfile.dev` に `jobs: bin/jobs start` を入れているため、ローカル起動時にワーカーも立ち上がります。"
