features:
- slug: authentication-generator
  category: Interactive Demo
  demo_type: runtime_demo
  title: 認証ジェネレータ
  summary: Rails の標準認証機能の変化を、アカウント登録・ログイン・保護ページで確認できます。
  notes_by_version:
    '7.0': 標準の認証ジェネレータはなく、Devise などのライブラリや独自実装が必要でした。
    '8.0': 認証ジェネレータで、ユーザー・セッション・パスワード再設定の土台を作成できるようになりました。
    8.1.4: Rails 8 系の標準認証を、Current.session、リクエストの頻度制限、パスワード再設定とあわせて学習できます。
  highlights_by_version:
    '7.0': 標準の認証ジェネレータは未同梱
    '8.0': 標準の認証ジェネレータを追加
    8.1.4: Rails 8 系の認証機能を継続
  status_by_version:
    '7.0': 独自実装または外部ライブラリを選択
    '8.0': 標準ジェネレータを利用可能
    8.1.4: Rails の標準認証を利用可能
  files_by_version:
    '7.0':
    - app/controllers/concerns/authentication.rb
    - app/controllers/sessions_controller.rb
    - app/controllers/passwords_controller.rb
    - app/views/sessions/new.html.erb
    '8.0':
    - app/models/user.rb
    - app/models/session.rb
    - app/controllers/sessions_controller.rb
    - app/controllers/passwords_controller.rb
    8.1.4:
    - app/models/current.rb
    - app/models/session.rb
    - app/views/auth_labs/show.html.erb
    - app/views/passwords/edit.html.erb
  upgrade_notes_by_version:
    '7.0':
    - 独自の認証を、生成したセッション・パスワード再設定・署名付き Cookie に置き換える範囲を検討します。
    - ジェネレータを採用する前に、独自のログイン・再設定の経路を確認します。
    '8.0':
    - 生成したコントローラを、既存のログイン・再設定画面に接続します。
    - 保護ページでは、未認証でアクセスできる範囲を明確にします。
    8.1.4:
    - 更新時は Current.session と rate_limit の挙動を確認します。
    - 保護ページへのリダイレクトが既存の認証フローと一致するか確認します。
  code_examples_by_version:
