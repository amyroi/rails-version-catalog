  source_links_by_version:
    '7.0': https://guides.rubyonrails.org/7_0_release_notes.html
    '8.0': https://guides.rubyonrails.org/8_0_release_notes.html
    8.1.4: https://guides.rubyonrails.org/8_1_release_notes.html
  demo_notes:
